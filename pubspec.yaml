name: sdv_application
description: "Smart City Transport - Car Rental Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.13.1
  lottie: ^3.3.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.5.3
  http: ^1.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add custom fonts to your application, add a fonts section here
  # Download Inter font from https://fonts.google.com/specimen/Inter
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter_24pt-Regular.ttf
        - asset: fonts/Inter_24pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_28pt-Bold.ttf
          weight: 700
    - family: Courier
      fonts:
        - asset: fonts/CourierPrime-Regular.ttf