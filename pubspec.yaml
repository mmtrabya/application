name: sdv_application
description: "Smart City Transport - Autonomous Vehicle Rental"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  cloud_functions: ^5.1.4
  webview_flutter: ^4.10.0
  flutter:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.6
  firebase_database: ^11.2.1
  firebase_messaging: ^15.1.5

  # Maps & Location
  google_maps_flutter: ^2.9.0
  location: ^7.0.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Camera & Images
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Local Storage
  shared_preferences: ^2.3.3

  # HTTP & Networking
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter_18pt-Regular.ttf
        - asset: fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_24pt-Bold.ttf
          weight: 700
        - asset: fonts/Inter_28pt-ExtraBold.ttf
          weight: 800
